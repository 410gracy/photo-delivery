<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>写真サムネイル負荷診断 v2</title><style>body{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;max-width:760px;margin:auto;padding:18px;background:#f7f7f7;color:#222}h1{font-size:1.4rem}label{display:block;margin-top:14px;font-weight:600}input{box-sizing:border-box;width:100%;padding:12px;border:1px solid #aaa;border-radius:6px;font-size:16px}button{padding:12px 16px;border:0;border-radius:6px;background:#222;color:#fff;margin:12px 8px 4px 0;font-size:15px}button:disabled{opacity:.4}.note,.panel{background:#fff;padding:14px;border-radius:7px;margin:12px 0}.note{border-left:4px solid #777}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#fff;padding:12px;border-radius:6px;font-size:12px}.muted{color:#555;font-size:.9rem}</style></head><body><h1>写真サムネイル負荷診断 v2（管理者用）</h1><p class="note">既存の納品ページは変更しません。公開して問題のないテスト画像のみ使用してください。APIキー・フォルダID・写真URLは診断ログに含めません。Google APIおよびGoogle Driveへの通信は発生します。テスト中は画面を閉じないでください。</p><label for="key">Google Drive APIキー</label><input id="key" type="password" autocomplete="off" placeholder="AIza..."><label for="folder">テスト用Google Drive フォルダID</label><input id="folder" autocomplete="off" placeholder="フォルダURLの /folders/ の後ろ"><button id="start">166枚相当の診断開始</button><button id="copy" disabled>診断結果をコピー</button><div id="status" class="panel" role="status">未実行</div><div id="results"></div><h2>共有用診断ログ（ID・キー・写真URLを除外）</h2><pre id="log">まだ診断していません。</pre><script>
'use strict';const $=id=>document.getElementById(id);let logs=[];function record(s){logs.push(s);$('log').textContent=logs.join('\n')}function panel(s){let e=document.createElement('div');e.className='panel';e.textContent=s;$('results').appendChild(e);return e}function loadImage(url,timeout=12000){return new Promise(resolve=>{let img=new Image(),done=false,t0=performance.now();img.referrerPolicy='no-referrer';const finish=(ok,reason)=>{if(done)return;done=true;clearTimeout(timer);img.onload=img.onerror=null;img.src='';resolve({ok,reason,ms:Math.round(performance.now()-t0)})};const timer=setTimeout(()=>finish(false,'timeout'),timeout);img.onload=()=>finish(true,'loaded');img.onerror=()=>finish(false,'error');img.src=url})}
async function runBatch(label,urls,concurrency,retry){const status=panel(label+'：準備中');let index=0,completed=0,firstOk=0,recovered=0,failed=0,errors=0,timeouts=0,totalMs=0;async function worker(){while(index<urls.length){const i=index++;let r=await loadImage(urls[i]);totalMs+=r.ms;if(r.ok)firstOk++;else{if(r.reason==='timeout')timeouts++;else errors++;if(retry){await new Promise(resolve=>setTimeout(resolve,300));let r2=await loadImage(urls[i]);totalMs+=r2.ms;if(r2.ok)recovered++;else failed++}else failed++}completed++;if(completed%10===0||completed===urls.length)status.textContent=label+'：'+completed+'/'+urls.length+' 件完了'}}await Promise.all(Array.from({length:concurrency},worker));let summary=label+'：初回成功 '+firstOk+'/'+urls.length+'、再試行で回復 '+recovered+'、最終失敗 '+failed+'、初回error '+errors+'、初回timeout '+timeouts+'、延べ読込時間 '+totalMs+'ms';status.textContent=summary;record(summary)}
async function start(){let key=$('key').value.trim(),folder=$('folder').value.trim();if(!key||!folder){$('status').textContent='APIキーとフォルダIDを入力してください';return}if(!/^[A-Za-z0-9_-]+$/.test(folder)){$('status').textContent='フォルダIDの形式を確認してください';return}logs=[];$('results').replaceChildren();$('start').disabled=true;$('copy').disabled=true;record('診断日時: '+new Date().toLocaleString('ja-JP'));record('端末: '+(/iPhone|iPad|iPod/.test(navigator.userAgent)?'iOS/iPadOS':/Android/.test(navigator.userAgent)?'Android':'PC/その他'));record('診断方式: 最大166回の画像要求。少数画像の繰り返しであり実際の166枚とは異なる。');try{$('status').textContent='Google Drive APIでテスト画像を取得しています…';let q="'"+folder+"' in parents and mimeType contains 'image/' and trashed = false";let params=new URLSearchParams({q,fields:'nextPageToken,files(id,thumbnailLink)',pageSize:'100',key});let res=await fetch('https://www.googleapis.com/drive/v3/files?'+params),data=await res.json();if(!res.ok)throw Error('Google Drive API HTTP '+res.status+' / '+(data.error?.status||'エラー'));let files=data.files||[];record('API画像取得: '+files.length+'件（最大100件）');if(!files.length)throw Error('テストフォルダに取得可能な画像がありません');let urls=Array.from({length:166},(_,i)=>'https://drive.google.com/thumbnail?id='+encodeURIComponent(files[i%files.length].id)+'&sz=w600');record('異なる画像数: '+files.length+' / 要求数: 166');record('注意: 同一URLの再利用にはブラウザキャッシュが働くため、負荷試験の結果は実際の166枚を完全には再現しません。');await runBatch('A: 同時6件・再試行なし',urls,6,false);await runBatch('B: 同時16件・失敗時1回再試行',urls,16,true);$('status').textContent='診断完了。「診断結果をコピー」でログを共有してください。'}catch(e){record('診断エラー: '+e.message);$('status').textContent='エラーが発生しました。ログをご確認ください。'}finally{$('start').disabled=false;$('copy').disabled=false}}
$('start').addEventListener('click',start);$('copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText($('log').textContent);$('status').textContent='ログをコピーしました'}catch(e){$('status').textContent='コピーできない場合はログのスクリーンショットを送ってください'}});
</script></body></html>
