<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>写真サムネイル診断（管理者用）</title>
<style>body{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;max-width:780px;margin:auto;padding:18px;background:#f7f7f7;color:#222}h1{font-size:1.4rem}h2{font-size:1.05rem;margin-top:28px}label{display:block;margin-top:14px;font-weight:600}input{box-sizing:border-box;width:100%;padding:12px;border:1px solid #aaa;border-radius:6px;font-size:16px}button{padding:12px 16px;border:0;border-radius:6px;background:#222;color:white;margin:12px 8px 4px 0;font-size:15px}button:disabled{opacity:.4}.note{background:#fff;border-left:4px solid #777;padding:12px;font-size:.9rem}.test{background:#fff;padding:12px;margin:10px 0;border-radius:8px}.test img{display:block;width:180px;max-width:100%;min-height:60px;object-fit:contain;background:#eee;margin-top:8px}.ok{color:#087a40}.bad{color:#b42318}.muted{color:#666;font-size:.85rem}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#fff;padding:12px;border-radius:6px;font-size:12px}#results{overflow-wrap:anywhere}</style></head>
<body><h1>写真サムネイル診断（管理者用）</h1><p class="note">本番の納品ページには影響しません。APIキーとフォルダIDはこの画面でのみ使用し、保存・外部送信（Google APIへの照会を除く）しません。お客様の写真やURLは診断結果に含めません。診断終了後はこのページを閉じてください。</p>
<label for="key">Google Drive APIキー（管理者のみ）</label><input id="key" type="password" autocomplete="off" placeholder="AIza...">
<label for="folder">Google Drive フォルダID</label><input id="folder" autocomplete="off" placeholder="フォルダURLの /folders/ の後ろの文字列">
<button id="start">診断開始</button><button id="copy" disabled>診断結果をコピー</button>
<div id="status" role="status"></div><div id="results"></div><h2>共有用の診断ログ（写真・ID・キーを除外）</h2><pre id="log">まだ診断していません。</pre>
<script>
'use strict';
const $=id=>document.getElementById(id), log=[];
function record(s){log.push(s);$('log').textContent=log.join('\n')}
function line(s,cls=''){const p=document.createElement('p');p.textContent=s;p.className=cls;$('results').appendChild(p)}
function testImage(label,url){return new Promise(resolve=>{const wrap=document.createElement('div');wrap.className='test';const title=document.createElement('strong');title.textContent=label;const status=document.createElement('div');status.className='muted';status.textContent='読み込み中…';const img=new Image();img.alt='診断対象の写真';img.referrerPolicy='no-referrer';img.loading='eager';wrap.append(title,status,img);$('results').appendChild(wrap);let finished=false;const start=performance.now();const done=ok=>{if(finished)return;finished=true;clearTimeout(timer);const ms=Math.round(performance.now()-start);status.textContent=(ok?'成功':'失敗')+' / '+ms+'ms'+(ok?' / '+img.naturalWidth+'×'+img.naturalHeight:'');status.className=ok?'ok':'bad';record(label+': '+(ok?'成功':'失敗')+' ('+ms+'ms)');resolve(ok)};const timer=setTimeout(()=>done(false),12000);img.onload=()=>done(true);img.onerror=()=>done(false);img.src=url})}
async function start(){const key=$('key').value.trim(),folder=$('folder').value.trim();if(!key||!folder){$('status').textContent='APIキーとフォルダIDを入力してください。';return}if(!/^[A-Za-z0-9_-]+$/.test(folder)){$('status').textContent='フォルダIDの形式を確認してください。';return}log.length=0;$('results').replaceChildren();$('start').disabled=true;$('copy').disabled=true;$('status').textContent='Google Drive APIで写真を確認しています…';record('診断日時: '+new Date().toLocaleString('ja-JP'));record('端末: '+(/iPhone|iPad|iPod/.test(navigator.userAgent)?'iOS/iPadOS':/Android/.test(navigator.userAgent)?'Android':'PC/その他'));try{const q="'"+folder+"' in parents and mimeType contains 'image/' and trashed = false";const params=new URLSearchParams({q,fields:'nextPageToken,files(id,name,mimeType,thumbnailLink)',pageSize:'3',key});const res=await fetch('https://www.googleapis.com/drive/v3/files?'+params);const data=await res.json();if(!res.ok)throw Error('Google Drive API HTTP '+res.status+' / '+(data.error?.status||'エラー'));const files=data.files||[];record('API一覧取得: 成功 / 画像 '+files.length+'件（最大3件確認）');if(!files.length){line('画像が取得できませんでした。フォルダ共有設定とIDをご確認ください。','bad');return}const f=files[0];record('API thumbnailLink: '+(f.thumbnailLink?'あり':'なし'));line('画像1枚目について、以下の方式を比較します。');const base='https://drive.google.com/thumbnail?id='+encodeURIComponent(f.id);await testImage('A: 現行URL w600',base+'&sz=w600');await testImage('B: 現行URL w1600',base+'&sz=w1600');if(f.thumbnailLink)await testImage('C: APIのthumbnailLink',f.thumbnailLink);else record('C: API thumbnailLink がないためスキップ');if(files.length>1){line('複数画像の同時読み込み（最大3枚）');await Promise.all(files.map((x,i)=>testImage('D'+(i+1)+': 同時読み込み w600','https://drive.google.com/thumbnail?id='+encodeURIComponent(x.id)+'&sz=w600')))}$('status').textContent='診断が完了しました。下の「診断結果をコピー」を押してください。'}catch(e){record('API照会: '+e.message);$('status').textContent='診断中にエラーが発生しました。診断ログをご確認ください。'}finally{$('start').disabled=false;$('copy').disabled=false}}
$('start').addEventListener('click',start);$('copy').addEventListener('click',async()=>{const t=$('log').textContent;try{await navigator.clipboard.writeText(t);$('status').textContent='診断ログをコピーしました。'}catch(e){$('status').textContent='コピーできない場合はログ部分のスクリーンショットを送ってください。'}});
</script></body></html>
